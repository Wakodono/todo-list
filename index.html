<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo App</title><script defer="defer" src="./bundle.js"></script></head><body><div class="app-container"><aside class="sidebar"><button id="new-project">New Project</button><div id="projects-list"></div></aside><main class="main-content"><div class="todos-header"><h2>My Todos</h2><form action="" id="add-todo-form"><input id="todo-title" placeholder="Todo title" required/> <input id="todo-description" placeholder="Description" required/> <input type="date" id="todo-duedate"/> <select name="" id="todo-priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select> <button type="submit">Add Todo</button></form></div><div id="todos-list"></div></main></div><div class="project-modal-container"><div class="project-modal" id="project-modal"><h3>Create a new project</h3><form action="" id="project-form"><input id="project-name" placeholder="project name"> <textarea id="project-description" placeholder="Describe your project here..."></textarea> <input type="date" name="dueDate" id="project-due-date"> <button type="submit">Add Project</button></form><button class="close">X</button></div></div><div class="assign-to-project-modal-container"><div class="assign-modal" id="assign-modal"><h3>move to...</h3><button class="close-assign-to-project-module">X</button></div></div></body></html>
